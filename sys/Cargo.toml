[package]
authors.workspace = true
categories = ["rendering", "graphics", "external-ffi-bindings"] # https://crates.io/category_slugs
description = "Low-level sys bindings for AMD's FidelityFX SDK"
edition.workspace = true
homepage.workspace = true
include = ["src", "LICENSE"]
keywords.workspace = true
license.workspace = true
name = "fidelityfx-sys"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
libloading = "0.8"
ash = { version = "0.38", optional = true, default-features = false }

[features]
default = ["vulkan", "dx12"]
vulkan = ["dep:ash"]
dx12 = []
